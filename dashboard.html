<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Canvas | PLH-Intelligence - SMART Ekselensia Indonesia</title>
  
  <meta name="description" content="Dashboard Single Page Application (SPA) Sistem Pendukung Keputusan Piket Lingkungan SMART Ekselensia Indonesia.">
  
  <!-- Favicon System -->
  <link rel="icon" type="image/x-icon" href="./public/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="./public/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./public/favicon-32x32.png">

  <!-- Font External: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Impor CSS Global via Path Relatif -->
  <link rel="stylesheet" href="./src/style/style.css">
  
  <!-- Impor CSS Dashboard Canvas via Path Relatif -->
  <link rel="stylesheet" href="./src/pages/dashboard/dashboard.css">
</head>
<body class="dashboard-body">

  <!-- Overlay untuk Sidebar pada Tampilan Mobile -->
  <div id="sidebarOverlay" class="sidebar-overlay"></div>

  <div class="dashboard-layout">
    
    <!-- ==========================================================================
       SIDEBAR NAVIGATION (NAVBAR SPA CONTROLLER)
       ========================================================================== -->
    <aside id="sidebar" class="dashboard-sidebar">
      <!-- Sidebar Header & Logo -->
      <div class="sidebar-header">
        <a href="./index.html" class="brand-logo" aria-label="Halaman Utama PLH-Intelligence">
          <img src="./src/assets/logo.png" alt="Logo PLH-Intelligence" class="brand-img" onerror="this.style.display='none'">
          <span class="brand-text"><span>PLH</span>-Intelligence</span>
        </a>
        <button id="sidebarCloseBtn" class="sidebar-close-btn" aria-label="Tutup Sidebar">✕</button>
      </div>

      <div class="sidebar-badge-container">
        <span class="badge badge-accent text-xs">🌱 Portal Adiwiyata</span>
      </div>

      <!-- Navigasi SPA Items (5 Menu Utama) -->
      <nav class="sidebar-nav">
        <ul class="nav-menu-list">
          <!-- 1. Dashboard -> quickView.js -->
          <li class="nav-item">
            <button class="spa-nav-btn active" data-view="quickView" data-title="Dashboard">
              <span class="nav-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
              </span>
              <span class="nav-label">Dashboard</span>
            </button>
          </li>

          <!-- 2. Input Data -> formView.js -->
          <li class="nav-item">
            <button class="spa-nav-btn" data-view="formView" data-title="Input Data">
              <span class="nav-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              </span>
              <span class="nav-label">Input Data</span>
            </button>
          </li>

          <!-- 3. Cek Data -> data.js -->
          <li class="nav-item">
            <button class="spa-nav-btn" data-view="data" data-title="Cek Data">
              <span class="nav-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><polyline points="12 11 12 17 10 15"/><polyline points="12 17 14 15"/></svg>
              </span>
              <span class="nav-label">Cek Data</span>
            </button>
          </li>

          <!-- 4. Analisis -> periodic.js -->
          <li class="nav-item">
            <button class="spa-nav-btn" data-view="periodic" data-title="Analisis Periodic">
              <span class="nav-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
              </span>
              <span class="nav-label">Analisis</span>
            </button>
          </li>

          <!-- 5. Saran Keputusan -> dssView.js -->
          <li class="nav-item">
            <button class="spa-nav-btn" data-view="dssView" data-title="Saran Keputusan (DSS)">
              <span class="nav-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
              </span>
              <span class="nav-label">Saran Keputusan</span>
            </button>
          </li>
        </ul>
      </nav>

      <!-- Sidebar Footer User Session Info -->
      <div class="sidebar-footer">
        <div class="user-session-card">
          <div class="user-avatar" id="userAvatar">U</div>
          <div class="user-info">
            <span class="user-name" id="userName">Pengguna PLH</span>
            <span class="user-role-badge text-xs" id="userRoleBadge">Aktif</span>
          </div>
        </div>
        <button id="logoutBtn" class="btn btn-outline btn-sm logout-btn" title="Keluar Sistem">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span>Keluar</span>
        </button>
      </div>
    </aside>

    <!-- ==========================================================================
       MAIN CONTENT CONTAINER (SPA CANVAS)
       ========================================================================== -->
    <div class="dashboard-main">
      
      <!-- Topbar Header -->
      <header class="topbar">
        <div class="topbar-left">
          <button id="sidebarToggleBtn" class="topbar-toggle-btn" aria-label="Buka Menu Navigasi">
            ☰
          </button>
          <h2 id="topbarTitle" class="topbar-title">Dashboard</h2>
        </div>
        
        <div class="topbar-right">
          <div class="date-badge" id="currentDateBadge">--:--</div>
        </div>
      </header>

      <!-- WADAH CANVAS UTAMA UNTUK MENAMPILKAN MODUL DARI FOLDER VIEWS -->
      <main id="spaCanvas" class="spa-canvas" aria-live="polite">
        <!-- Modul dari folder views/ akan dirender secara dinamis oleh dashboard.js di sini -->
      </main>

    </div>
  </div>

  <!-- Impor JavaScript Router Canvas via Path Relatif -->
  <script type="module" src="./src/pages/dashboard/dashboard.js"></script>
</body>
</html>
