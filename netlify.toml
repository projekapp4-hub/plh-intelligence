[build]
  publish = "dist"
  command = "npm run build"

[dev]
  framework = "#custom"
  command = "npm run dev"
  targetPort = 3000
  port = 8888

[functions]
  directory = "netlify/functions"

# Proxy /api/gemini ke Netlify Serverless Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

