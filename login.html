<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk Sistem | PLH-Intelligence - SMART Ekselensia Indonesia</title>
  
  <!-- Meta Tag SEO & Deskripsi -->
  <meta name="description" content="Halaman autentikasi masuk sistem PLH-Intelligence SMART Ekselensia Indonesia.">
  
  <!-- Favicon System -->
  <link rel="icon" type="image/x-icon" href="./public/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="./public/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./public/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="./public/favicon-48x48.png">

  <!-- Font External: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Menggunakan Jalur Relatif ke Style Global -->
  <link rel="stylesheet" href="./src/style/style.css">
  
  <!-- Menggunakan Jalur Relatif ke Style Spesifik Login -->
  <link rel="stylesheet" href="./src/pages/login/login.css">
</head>
<body class="login-body">

  <!-- ==========================================================================
     HEADER / NAVIGASI KEMBALI
     ========================================================================== -->
  <header class="login-header">
    <div class="login-header-container">
      <a href="./landing.html" class="brand-logo" aria-label="Kembali ke Landing Page">
        <img src="./src/assets/logo.png" alt="Logo PLH-Intelligence" class="brand-img" onerror="this.style.display='none'">
        <span class="brand-text"><span>PLH</span>-Intelligence</span>
      </a>
      <a href="./landing.html" class="btn btn-outline btn-sm back-link">
        <span class="back-text-full">← Kembali ke Beranda</span>
        <span class="back-text-short">← Beranda</span>
      </a>
    </div>
  </header>

  <!-- ==========================================================================
     MAIN LOGIN CONTAINER
     ========================================================================== -->
  <main class="login-main">
    <div class="login-wrapper">
      <div class="login-card-container">
        
          <!-- Header Kartu Login -->
          <div class="login-card-header text-center">
            <div class="badge badge-accent login-badge">
              🌿 PORTAL ADIWIYATA
            </div>
            <h1 class="login-title">Selamat Datang</h1>
            <p class="login-subtitle">
              Masuk ke sistem <strong>PLH–Intelligence</strong> untuk mengelola dan memantau piket lingkungan sekolah.
            </p>
          </div>

        <!-- Wadah Pesan Umpan Balik (Diselaraskan ID menjadi alertContainer) -->
        <div id="alertContainer" class="alert-container" aria-live="polite"></div>

        <!-- Form Autentikasi -->
        <form id="loginForm" class="login-form" novalidate>

          <!-- Input Identitas Universal -->
          <div class="form-group">
            <label for="usernameInput" class="form-label">
              NIS / NIP / Username
            </label>
            <div class="input-icon-wrapper">
              <input 
                type="text" 
                id="usernameInput" 
                name="username" 
                class="form-control" 
                placeholder="Masukkan NIS, NIP, atau Username..." 
                required 
                autocomplete="username"
              >
            </div>
            <span class="field-error-msg" id="usernameError"></span>
          </div>

          <!-- Input Kata Sandi -->
          <div class="form-group">
            <div class="label-with-action">
              <label for="passwordInput" class="form-label">Kata Sandi</label>
            </div>
            <div class="input-password-wrapper">
              <input
                type="password"
                id="passwordInput"
                name="password"
                class="form-control"
                placeholder="Masukkan kata sandi..."
                required
                autocomplete="current-password"
              >
              <button type="button" id="togglePasswordBtn" class="password-toggle-btn" aria-label="Tampilkan Kata Sandi">
                <svg class="eye-icon eye-open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="eye-icon eye-closed" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
            <span class="field-error-msg" id="passwordError"></span>
          </div>

          <!-- Tombol Eksekusi Submit (Ditambahkan atribut ID pada elemen internal) -->
          <button type="submit" id="submitBtn" class="btn btn-primary btn-lg login-submit-btn">
            <span id="btnText" class="btn-text">Masuk ke Dashboard</span>
            <span id="btnSpinner" class="btn-spinner" aria-hidden="true" style="display: none;">⏳</span>
          </button>
        </form>

        <!-- Footer Kartu Login -->
        <div class="login-card-footer text-center">
          <p class="institution-tag">
            SMART Ekselensia Indonesia<br>
            <span class="institution-subtext">Sekolah Adiwiyata Tingkat Provinsi</span>
          </p>
          <div class="dev-demo-callout">
            <span class="callout-icon">💡</span>
            <div class="callout-content">
              <strong>Kredensial Demo Pengujian:</strong>
              <code>Username: <span>admin</span></code> | <code>Password: <span>admin</span></code>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- Menggunakan Jalur Relatif ke Berkas JavaScript -->
  <script type="module" src="./src/pages/login/login.js"></script>
</body>
</html>
